# dev (westus2, one region): no Front Door. Users reach Kong's DNS name over HTTPS; the name is
# Terraform's kong_fqdn (environments/dev.tfvars: name_suffix poc01d).
global:
  region: westus2
  # From infra/entra/setup.sh (workforce tenant, example.com users; identifiers, not secrets).
  # The SPA app lists this environment's URL as a redirect URI.
  entra:
    tenantId: "00000000-0000-0000-0000-000000000001"
    audience: "00000000-0000-0000-0000-000000000002"
    spaClientId: "00000000-0000-0000-0000-000000000003"
    authority: "https://login.microsoftonline.com/00000000-0000-0000-0000-000000000001"
    knownAuthority: ""
    apiScope: "api://00000000-0000-0000-0000-000000000002/access_as_user"

ingress:
  host: corportal-poc01d-primary.westus2.cloudapp.azure.com
  tls:
    enabled: true

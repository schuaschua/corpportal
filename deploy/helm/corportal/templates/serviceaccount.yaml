{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
{{- /* One identity per service: Vault's Kubernetes auth role and, where set, the Azure workload
     identity federated to this cluster's OIDC issuer (Terraform module `identity`). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "corportal.labels" $ctx | nindent 4 }}
  {{- with $svc.workloadIdentityClientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}

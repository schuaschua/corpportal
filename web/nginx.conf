# Rendered from env at start (see Dockerfile). Serves the SPA and, for compose, proxies the
# APIs same-origin so the browser can read X-Served-From without CORS. In AKS, Kong routes
# /api/accounts/*, /api/payments/* and /api/insights/* the same way.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve upstreams per request so the container starts even when an API is down.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/accounts/ {
        set $accounts_upstream ${ACCOUNTS_API_URL};
        rewrite ^/api/accounts/(.*)$ /$1 break;
        proxy_pass $accounts_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/payments/ {
        set $payments_upstream ${PAYMENTS_API_URL};
        rewrite ^/api/payments/(.*)$ /$1 break;
        proxy_pass $payments_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/insights/ {
        set $insights_upstream ${INSIGHTS_API_URL};
        rewrite ^/api/insights/(.*)$ /$1 break;
        proxy_pass $insights_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

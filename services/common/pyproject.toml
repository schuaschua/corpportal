[project]
name = "corp-common"
version = "0.1.0"
description = "Shared DB, auth, company scoping and region header for the portal services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pyodbc>=5.1",
    "pyjwt[crypto]>=2.9",
    "azure-identity>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corp_common"]
